<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BZF Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BZF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: ein Cockpit-Bildschirm (FMS-CDU, frühe 80er). Grauer Rahmen, schwarzer Schirm, Hardware-Tasten oben fest.
   Farben mit Cockpit-Bedeutung: Grün aktiv/richtig, Bernstein Achtung/falsch, Weiß Daten, Cyan antippbar, Magenta eigene Funksprüche. */
:root{
  --screen:#020403; --panel:#0b0e10; --bezel:#2b3034; --key:#3a4045; --key-hi:#4a5157; --line:#1f3328;
  --white:#e9efe9; --dim:#8fa39a; --green:#3ee87a; --amber:#ffb22e; --cyan:#4fd8ff; --magenta:#ff5fd2;
  --green-soft:rgba(62,232,122,.10); --amber-soft:rgba(255,178,46,.12); --cyan-soft:rgba(79,216,255,.10);
  --display:"VT323",ui-monospace,monospace;
  --body:"B612 Mono",ui-monospace,Menlo,Consolas,monospace;
  --glow:0 0 4px currentColor;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--panel);color:var(--white);font:15px/1.5 var(--body);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
/* Bildröhre: Scanlines und abgedunkelte Ränder über allem, ohne Klicks abzufangen */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px),
             radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);display:flex;flex-direction:column;gap:6px;padding-block:8px 8px}
h1{font:400 2rem/1 var(--display);letter-spacing:.06em;margin:0;color:var(--green);text-shadow:var(--glow)}
h1 small{font:400 1.05rem var(--display);color:var(--dim);letter-spacing:.04em;margin-left:8px;text-shadow:none}
h2{font:400 1.6rem/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--white);text-shadow:var(--glow);text-wrap:balance}
/* Hardware-Funktionstasten */
nav{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 0;min-width:0;white-space:nowrap;font:400 1.15rem/1 var(--display);letter-spacing:.06em;color:var(--white);
  background:linear-gradient(var(--key-hi),var(--key));border:1px solid #15181a;border-radius:4px;padding:8px 4px 7px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #101214}
nav button:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
nav button[aria-current="true"]{color:var(--green);text-shadow:var(--glow)}
nav button[aria-current="true"]::after{content:"";display:block;width:60%;height:3px;margin:4px auto 0;background:var(--green);box-shadow:0 0 6px var(--green);border-radius:2px}
button{font-family:inherit}
.btn{font:400 1.25rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--white);
  background:linear-gradient(var(--key-hi),var(--key));border:1px solid #15181a;border-radius:4px;padding:10px 14px 9px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #101214}
.btn:active{transform:translateY(1px)}
#primary.btn,.btn.main{color:var(--green);text-shadow:var(--glow)}
.btn.ghost{background:transparent;border:1px solid var(--bezel);box-shadow:none;color:var(--cyan)}
.btn.small{font-size:1.05rem;padding:6px 10px 5px}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font:400 1.05rem/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--display);font-size:1.15em;letter-spacing:.04em;font-variant-numeric:tabular-nums}
/* Bildschirm mit Rahmen */
.card{background:var(--screen);border:6px solid var(--bezel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;
  box-shadow:inset 0 0 24px rgba(62,232,122,.06),inset 0 0 0 1px #000}
.next{border-color:#33402f}
.next h2{color:var(--green)}
.stand{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--screen);border:6px solid var(--bezel);border-radius:10px;overflow:hidden}
.stand div{padding:10px 12px;border-left:1px solid var(--line)}
.stand div:first-child{border-left:0}
.stand b{display:block;font:400 2rem/1 var(--display);color:var(--green);text-shadow:var(--glow)}
.stand b small{color:var(--dim);font-size:1rem;text-shadow:none}
/* Segmentbalken wie Bandanzeigen */
.bar{position:relative;height:12px;background:#0d1a12;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%;box-shadow:0 0 6px currentColor}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--screen) 6px 8px);pointer-events:none}
.topics{display:flex;flex-direction:column;background:var(--screen);border:6px solid var(--bezel);border-radius:10px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;color:var(--white);font:inherit}
.topic:first-child{border-top:0}
.topic::before{content:"<";position:absolute;opacity:0}
.topic:hover,.topic:focus-visible{background:var(--cyan-soft)}
.topic .bar{grid-column:1/-1}
.sub{color:var(--dim);font-size:.85rem}
/* Seitentitel wie am CDU: Titel mittig, Seitenzähler rechts */
.cdu-title{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:8px}
.cdu-title .t{grid-column:2;font:400 1.35rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--white);text-shadow:var(--glow);text-align:center}
.cdu-title .p{grid-column:3;justify-self:end;font:400 1.35rem/1 var(--display);color:var(--white)}
.cdu-title .l{grid-column:1;justify-self:start}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qno{font:400 1.15rem/1 var(--display);color:var(--cyan);letter-spacing:.05em}
.qtext{font-weight:700;font-size:1.02rem;margin:0;color:var(--white)}
.prog{height:6px;background:#0d1a12;position:relative}
.prog i{display:block;height:100%;background:var(--green);box-shadow:0 0 6px var(--green)}
.prog::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--screen) 6px 8px)}
/* Antworten als Zeilenwahltasten */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;align-items:start;text-align:left;font:inherit;color:var(--white);background:transparent;border:1px solid var(--line);border-radius:3px;padding:10px 10px;min-height:48px;cursor:pointer}
.opt .k{font:400 1.35rem/1 var(--display);color:var(--cyan);text-shadow:var(--glow);white-space:nowrap}
.opt .k::before{content:"<"}
.opt:hover:not(:disabled){border-color:var(--cyan);background:var(--cyan-soft)}
.opt.sel{border-color:var(--cyan);background:var(--cyan-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.right .k{color:var(--green)}
.opt.wrong{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.opt.wrong .k{color:var(--amber)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
/* Rückmeldung als Warnlampe */
.fb{display:flex;align-items:center;gap:10px;font-weight:700}
.fb:empty{display:none}
.fb.ok{color:var(--green)} .fb.no{color:var(--amber)}
.ann{font:400 1.3rem/1 var(--display);letter-spacing:.12em;padding:5px 10px 4px;border-radius:3px;border:2px solid currentColor;text-shadow:var(--glow);box-shadow:0 0 10px currentColor inset}
.ann.caution{color:#1a0f00;background:var(--amber);border-color:var(--amber);text-shadow:none;box-shadow:0 0 14px var(--amber)}
.ann.check{color:var(--green)}
.actions{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;margin:0 -14px -14px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--bezel)}
.actions .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.boxes{display:flex;gap:3px}
.boxes span{width:9px;height:9px;background:#0d1a12;border:1px solid var(--line)}
.boxes span.on{background:var(--green);box-shadow:0 0 5px var(--green);border-color:var(--green)}
.symbol{display:flex;justify-content:center;padding:6px;color:var(--white)}
.symbol svg{width:70px;height:70px}
.field{display:flex;flex-direction:column;gap:4px}
select,input[type=number],input[type=search],textarea{font:inherit;color:var(--green);background:#000;border:1px solid var(--line);border-radius:3px;padding:8px 10px}
input[type=search]{border:6px solid var(--bezel);border-radius:10px;padding:10px 12px}
textarea{width:100%;min-height:90px;font:.8rem var(--body)}
/* Scratchpad-Zeile wie am CDU */
.scratch{width:100%;font:1rem/1.4 var(--body);color:var(--magenta);background:#000;border:0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 4px;min-height:72px;resize:vertical}
.scratch::placeholder{color:var(--dim)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--screen);border:6px solid var(--bezel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.item .ans{color:var(--green)}
.item .yours{color:var(--amber)}
.timer{font:400 1.35rem var(--display);color:var(--amber);text-shadow:var(--glow)}
.result{font:400 4rem/1 var(--display);text-shadow:var(--glow);color:var(--green)}
.note{color:var(--dim);font-size:.85rem;margin:0}
.expl{margin:0;padding:8px 10px;border-left:2px solid var(--cyan);background:var(--cyan-soft);font-size:.9rem;color:var(--white)}
.lesson-body{display:flex;flex-direction:column;gap:8px;font-size:.98rem;min-height:8em}
.lesson-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.lesson-body li::marker{color:var(--green)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots span{width:7px;height:7px;background:#0d1a12;border:1px solid var(--line)}
.dots span.on{background:var(--green);border-color:var(--green);box-shadow:0 0 4px var(--green)}
.radio{font:400 1.25rem/1.3 var(--display);letter-spacing:.03em;color:var(--white);background:#000;border:1px solid var(--line);padding:10px 12px;text-shadow:var(--glow)}
.radio .who{display:block;font-size:1rem;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.model{font:400 1.25rem/1.3 var(--display);color:var(--magenta);text-shadow:var(--glow);border-left:2px solid var(--magenta);padding:8px 10px;background:rgba(255,95,210,.07)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys span{font:400 1rem var(--display);letter-spacing:.04em;padding:2px 8px;border:1px solid var(--line)}
.keys .hit{border-color:var(--green);color:var(--green)} .keys .miss{border-color:var(--amber);color:var(--amber)}
.seg{display:inline-flex;gap:5px}
.seg button{font:400 1.1rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--white);background:linear-gradient(var(--key-hi),var(--key));border:1px solid #15181a;border-radius:4px;padding:7px 10px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--green);text-shadow:var(--glow)}
.tag{font:400 1rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
/* Kompakte Themenseite */
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb .back{flex:none}
.crumb h2{min-width:0;font-size:1.45rem}
.back{font:400 1.3rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--cyan);padding:2px 0;cursor:pointer}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step .n{grid-row:span 3;font:400 1.3rem/24px var(--display);width:28px;height:28px;text-align:center;border:2px solid var(--dim);color:var(--dim)}
.step.cur .n{border-color:var(--cyan);color:var(--cyan)}
.step.done .n{border-color:var(--green);color:var(--green);box-shadow:0 0 6px var(--green)}
.step > :not(.n){grid-column:2;min-width:0}
.step b{font-weight:700}
.step .row{margin-top:4px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"> ";color:var(--cyan)}
details[open] summary::before{content:"v ";}
p{margin:0}
@media (max-width:420px){nav button{font-size:1.05rem}.btn{font-size:1.15rem;padding:9px 11px 8px}.stand b{font-size:1.7rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .1s,background .1s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BZF Trainer<small>BNetzA-Katalog 2024</small></h1>
    <nav id="nav" aria-label="Bereiche">
      <button data-v="home">START</button>
      <button data-v="learn">LERNEN</button>
      <button data-v="radio">FUNK</button>
      <button data-v="exam" aria-label="Prüfung">PRÜF</button>
      <button data-v="catalog">KATALOG</button>
    </nav>
  </header>
  <main id="main" class="stack"></main>
</div>
<script src="questions.js"></script>
<script src="lessons.js"></script>
<script src="scenarios.js"></script>
<script>
"use strict";
const Q = window.BZF_QUESTIONS;
const LESSONS = window.BZF_LESSONS || [];
const SCEN = window.BZF_SCENARIOS || [];
const TOPICS = [
  ["Rechtsgrundlagen und Funkstellen",1,11],
  ["Begriffe, Abkürzungen, Q-Gruppen",12,32],
  ["Meldungsarten und Rangfolge",33,43],
  ["Übermittlung, Rufzeichen, Dienste",44,63],
  ["Redewendungen",64,81],
  ["Verfahren im Sprechfunkverkehr",82,121],
  ["Wettermeldungen",122,135],
  ["Not, Dringlichkeit, Funkausfall",136,152],
  ["Frequenzen und Wellenausbreitung",153,163],
  ["Flugverkehrsdienste und Einheiten",164,175],
  ["Luftverkehrsregeln und Signale",176,206],
  ["Luftraum, Sichtflugregeln, Transponder",207,232],
  ["Funknavigation",233,261]
];
const MASTER = 4;      // Leitner-Fach, ab dem eine Frage als sicher gilt
/* Ein Thema gilt als geschafft, wenn mehr als 95 % seiner Fragen zuletzt richtig beantwortet wurden.
   Bei wenigen Fragen, wo erst 100 % über 95 % lägen, genügt alles bis auf eine Frage. */
const needed = n => Math.min(n-1, Math.floor(0.95*n)+1);
const rightIn = nums => nums.filter(n => S.last[n]===1).length;
const topicDone = t => { const nums=topicNums(t); return rightIn(nums) >= needed(nums.length); };
const scenDone = s => S.scen[s.id]===s.steps.length;
const SYMBOLS = {
  117:'<svg viewBox="0 0 60 60" aria-label="Dreieck gefüllt in gestricheltem Kreis"><circle cx="30" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 9"/><path d="M30 17 L41 39 L19 39 Z" fill="currentColor"/></svg>',
  118:'<svg viewBox="0 0 60 60" aria-label="Dreieck ungefüllt in gestricheltem Kreis"><circle cx="30" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 9"/><path d="M30 18 L40 38 L20 38 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};

/* ---------- Fortschritt (nur in diesem Browser gespeichert) ---------- */
const KEY = "bzf-trainer-v1";
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.box) return fill(s); }catch(e){} return fill({}); }
function fill(s){ s.box=s.box||{}; s.last=s.last||{}; s.exams=s.exams||[]; s.les=s.les||{}; s.scen=s.scen||{}; return s; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const box = n => S.box[n] || 0;
function record(n, ok){ S.box[n] = ok ? Math.min(5, box(n)+1) : 1; S.last[n] = ok ? 1 : 0; save(); }

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const main = $("#main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const inTopic = (t, n) => n >= TOPICS[t][1] && n <= TOPICS[t][2];
const topicNums = t => Q.filter(q => inTopic(t, q.n)).map(q => q.n);
const lessonFor = t => LESSONS.find(l => l.t===t);
const lessonRead = t => { const L=lessonFor(t); return L ? Math.min(L.cards.length, S.les[t]||0) : 0; };
const wrongIn = nums => nums.filter(n => S.last[n]===0);
function stats(nums){
  let m=0, s=0, w=0;
  nums.forEach(n => { const b=box(n); if(b>=MASTER) m++; else if(b>0 && S.last[n]===1) s++; else if(S.last[n]===0) w++; });
  return {m, s, w, total:nums.length};
}
function bar(st){
  const p = x => (100*x/st.total).toFixed(1)+"%";
  const seg = (x, c) => `<i style="width:${p(x)};background:${c};color:${c}"></i>`;
  return `<div class="bar" role="img" aria-label="${st.m} von ${st.total} sicher">${seg(st.m,"var(--green)")}${seg(st.s,"rgba(62,232,122,.4)")}${seg(st.w,"var(--amber)")}</div>`;
}
const prog = (i, n) => `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><i style="width:${100*i/n}%"></i></div>`;
function fmt(text){
  const out=[]; let list=[];
  const flush=()=>{ if(list.length){ out.push("<ul>"+list.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>"); list=[]; } };
  String(text).split("\n").forEach(line=>{ const l=line.trim(); if(!l){ flush(); return; }
    if(l.startsWith("- ")) list.push(l.slice(2)); else { flush(); out.push(`<p>${esc(l)}</p>`); } });
  flush(); return out.join("");
}
const pad3 = x => String(x).padStart(3,"0");
const boxes = n => `<span class="boxes" title="Lernstand">${[1,2,3,4,5].map(k=>`<span class="${box(n)>=k?"on":""}"></span>`).join("")}</span>`;

/* ---------- Warnlampe und Signaltöne ---------- */
/* Die Töne sind mit der Web-Audio-Schnittstelle nachgebildet (keine Originalaufnahmen):
   falsch = Single Chime wie bei einer Caution-Meldung, richtig = kurzer leiser Bestätigungston. */
let actx = null;
function chime(freqs, dur, gain){
  if(S.snd===false) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime, out = actx.createGain();
    out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(gain, t0+0.01); out.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    out.connect(actx.destination);
    freqs.forEach(([f, a]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type="sine"; o.frequency.value=f; g.gain.value=a; o.connect(g); g.connect(out); o.start(t0); o.stop(t0+dur); });
  }catch(e){}
}
const sndCaution = () => chime([[1046,1],[2093,.35],[3139,.12]], 1.6, .32);
const sndCheck = () => chime([[1568,1],[3136,.2]], .18, .12);
function feedback(ok, text){
  const fb = $("#fb");
  fb.innerHTML = `<span class="ann ${ok?"check":"caution"}">${ok?"CHECK":"CAUTION"}</span><span>${esc(text)}</span>`;
  fb.className = "fb " + (ok?"ok":"no");
  ok ? sndCheck() : sndCaution();
}

/* ---------- Navigation mit Verlauf (Zurück-Taste auf Android) ---------- */
let timerId;
const stack = [];
function setNav(v){ document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v===v)); $("h1").hidden = v!=="home"; }
function go(render, replace){
  clearInterval(timerId);
  if(replace && stack.length){ stack[stack.length-1] = render; history.replaceState({d:stack.length}, ""); }
  else { stack.push(render); history.pushState({d:stack.length}, ""); }
  render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", () => {
  clearInterval(timerId);
  stack.pop();
  if(!stack.length){ stack.push(home); history.pushState({d:1}, ""); }
  stack[stack.length-1](); window.scrollTo(0,0);
});
const VIEWS = {home, learn, radio, exam:examSetup, catalog};
$("#nav").addEventListener("click", e => { const b=e.target.closest("button"); if(b) go(VIEWS[b.dataset.v]); });

/* Tastatur: 1–4 oder A–D antworten, Enter = rechter Hauptknopf, Pfeile blättern */
document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if(idx >= 0){ const o = [...main.querySelectorAll(".opt")][idx]; if(o && !o.disabled){ o.click(); e.preventDefault(); } return; }
  if(k==="enter" || k==="arrowright"){ const p=$("#primary"); if(p && !p.disabled && (k==="enter" || p.dataset.arrow)){ p.click(); e.preventDefault(); } }
  if(k==="arrowleft"){ const s=$("#secondary"); if(s && !s.disabled && s.dataset.arrow){ s.click(); e.preventDefault(); } }
});

/* ---------- Start ---------- */
function nextStep(){
  for(let t=0;t<TOPICS.length;t++){
    const L=lessonFor(t), read=lessonRead(t);
    if(L && read < L.cards.length) return {title:`Lektion lesen: ${TOPICS[t][0]}`, sub: read ? `Weiter bei Karte ${read+1} von ${L.cards.length}` : `${L.cards.length} Karten`, btn: read?"Weiterlesen":"Lektion starten", act:()=>go(()=>lessonCard(t, read))};
    if(!topicDone(t)){ const nums=topicNums(t);
      return {title:`Fragen üben: ${TOPICS[t][0]}`, sub:`${rightIn(nums)} von ${nums.length} richtig, ${needed(nums.length)} nötig`, btn:"Runde starten", act:()=>go(()=>round({topic:t}))}; }
  }
  const w = wrongIn(Q.map(q=>q.n));
  if(w.length) return {title:"Fehler wiederholen", sub:`${w.length} Fragen zuletzt falsch beantwortet`, btn:"Runde starten", act:()=>go(()=>round({only:w}))};
  return {title:"Prüfung simulieren", sub:"Alle Themen sind durchgearbeitet.", btn:"Zur Prüfung", act:()=>go(examSetup)};
}

/* ---------- Themenseite: Lektion, dann Fragen ---------- */
function topicPage(t){
  setNav("learn");
  const L=lessonFor(t), read=lessonRead(t), nums=topicNums(t), s=stats(nums), w=wrongIn(nums);
  const lDone = !L || read>=L.cards.length, qDone = topicDone(t), right = rightIn(nums), need = needed(nums.length);
  // Hauptaktion: Lektion, solange sie nicht gelesen ist, sonst Fragen
  const primary = !lDone ? {label: read?"Weiterlesen":"Lektion lesen", act:()=>go(()=>lessonCard(t, read))}
                         : {label:"Runde starten", act:()=>go(()=>round({topic:t}))};
  main.innerHTML = `<div class="card">
    <div class="crumb"><button class="back" id="secondary" aria-label="Alle Themen">‹</button><h2>${esc(TOPICS[t][0])}</h2></div>
    <span class="label num">Fragen ${TOPICS[t][1]}–${TOPICS[t][2]} · ${nums.length} Stück</span>
    <div class="steps">
      ${L?`<div class="step ${lDone?"done":"cur"}"><span class="n">1</span><b>Lektion lesen</b>
        <span class="sub">${read} von ${L.cards.length} Karten gelesen</span>
        ${lDone?`<div class="row"><button class="btn ghost small" id="les">Nochmal lesen</button></div>`:""}</div>`:""}
      <div class="step ${qDone?"done":lDone?"cur":""}"><span class="n">${L?2:1}</span><b>Fragen üben</b>
        <span class="sub">${right} von ${s.total} zuletzt richtig, ${need} nötig${qDone?" · geschafft":""}</span>
        <div class="row" style="flex-direction:column;align-items:stretch">${bar(s)}</div>
        <div class="row">${!lDone?`<button class="btn ghost small" id="rd">Runde</button>`:""}${w.length?`<button class="btn ghost small" id="rw">Fehler ${w.length}</button>`:""}<button class="btn ghost small" id="cat">Liste</button></div></div>
    </div>
    <div class="actions"><button class="btn ghost" id="bk">Themen</button><div class="right"><button class="btn" id="primary">${primary.label}</button></div></div>
  </div>`;
  $("#secondary").onclick = $("#bk").onclick = () => history.back();
  $("#primary").onclick = primary.act;
  if($("#les")) $("#les").onclick = () => go(()=>lessonCard(t, 0));
  if($("#rd")) $("#rd").onclick = () => go(()=>round({topic:t}));
  if($("#rw")) $("#rw").onclick = () => go(()=>round({only:w}));
  $("#cat").onclick = () => go(()=>catalog(String(TOPICS[t][1]), t));
}

/* ---------- Lektion: Karte für Karte ---------- */
function lessonCard(t, k){
  setNav("learn");
  const L = lessonFor(t), c = L.cards[k], last = k===L.cards.length-1;
  S.les[t] = Math.max(S.les[t]||0, k+1); save();
  main.innerHTML = `<div class="card" id="lc">
    <div class="cdu-title"><span class="t">Lektion</span><span class="p">${k+1}/${L.cards.length}</span></div>
    <span class="tag">${esc(TOPICS[t][0])}</span>
    ${prog(k+1, L.cards.length)}
    <h2>${esc(c.h)}</h2>
    <div class="lesson-body">${fmt(c.b)}</div>
    ${c.q&&c.q.length?`<div class="row"><span class="note">Passende Fragen: <span class="num">${c.q.join(", ")}</span></span><button class="btn ghost small" id="cardq">Diese üben</button></div>`:""}
    <div class="actions">
      <button class="btn ghost" id="secondary" data-arrow="1">${k?"Zurück":"Thema"}</button>
      <div class="right"><button class="btn" id="primary" data-arrow="1">${last?"Fragen üben":"Weiter"}</button></div>
    </div></div>`;
  $("#secondary").onclick = () => k ? go(()=>lessonCard(t, k-1), true) : history.back();
  $("#primary").onclick = () => last ? go(()=>round({topic:t}), true) : go(()=>lessonCard(t, k+1), true);
  if($("#cardq")) $("#cardq").onclick = () => go(()=>round({only:c.q}));
  // Wischen zum Blättern
  let x0=null, y0=null; const lc=$("#lc");
  lc.addEventListener("touchstart", e => { x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  lc.addEventListener("touchend", e => { if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>1.5*Math.abs(dy)){ if(dx<0) $("#primary").click(); else if(k) $("#secondary").click(); } }, {passive:true});
}

/* ---------- Lernrunde ---------- */
function round(opt){
  setNav("learn");
  const size = opt.size || 10;
  let pool = Q.filter(q => (opt.topic===undefined || inTopic(opt.topic,q.n)) && (!opt.only || opt.only.includes(q.n)));
  pool = shuffle(pool).sort((a,b) => box(a.n)-box(b.n)).slice(0, size);
  let i=0, right=0;
  const title = opt.topic!==undefined ? TOPICS[opt.topic][0] : opt.only ? "Ausgewählte Fragen" : "Gemischte Runde";
  const show = () => {
    if(i>=pool.length){
      main.innerHTML = `<div class="card"><span class="tag">${esc(title)}</span><h2>Runde beendet</h2><p class="result">${right}/${pool.length}</p>
        <div class="actions"><button class="btn ghost" id="secondary">Fertig</button><div class="right"><button class="btn" id="primary">Nächste Runde</button></div></div></div>`;
      $("#secondary").onclick = () => history.back();
      $("#primary").onclick = () => go(()=>round(opt), true);
      return;
    }
    const q = pool[i];
    renderQuestion(q, title, i, pool.length, {
      instant:true,
      onAnswer: ok => { if(ok) right++; record(q.n, ok); },
      left: {label:"Beenden", act:()=>history.back()},
      next: () => { i++; show(); window.scrollTo(0,0); }
    });
  };
  show();
}

/* Frage anzeigen. instant: sofortige Rückmeldung mit Erklärung (Lernen); sonst Auswahl merken (Prüfung) */
function renderQuestion(q, title, i, n, o){
  const order = shuffle([0,1,2,3]);
  main.innerHTML = `<div class="card">
    <div class="cdu-title">${o.timer?`<span class="l timer" id="tm"></span>`:""}<span class="t">${o.instant?"Frage":"Prüfung"}</span><span class="p">${i+1}/${n}</span></div>
    <span class="tag">${esc(title)}</span>
    ${prog(i, n)}
    <div class="qhead"><span class="qno">Nr. ${q.n}</span>${boxes(q.n)}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${SYMBOLS[q.n] ? `<div class="symbol">${SYMBOLS[q.n]}</div>` : ""}
    <div class="opts">${order.map((x,k)=>`<button class="opt" data-o="${x}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.a[x])}</span></button>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p>
    <p class="expl" id="ex" hidden></p>
    <div class="actions"><button class="btn ghost" id="secondary">${o.left.label}</button><div class="right" id="rt"></div></div>
  </div>`;
  $("#secondary").onclick = o.left.act;
  if(o.left.disabled) $("#secondary").disabled = true;
  const opts = [...main.querySelectorAll(".opt")];
  if(o.instant){
    opts.forEach(el => el.onclick = () => {
      const ok = +el.dataset.o===0;
      opts.forEach(x => { x.disabled=true; if(+x.dataset.o===0) x.classList.add("right"); });
      if(!ok) el.classList.add("wrong");
      feedback(ok, ok ? "Richtig." : "Falsch. Die richtige Antwort ist markiert.");
      if(q.e){ $("#ex").textContent = q.e; $("#ex").hidden = false; }
      o.onAnswer(ok);
      $("#rt").innerHTML = `<button class="btn" id="primary">Weiter</button>`;
      $("#primary").onclick = o.next; $("#primary").focus({preventScroll:true});
    });
  } else {
    const mark = () => opts.forEach(x => x.classList.toggle("sel", +x.dataset.o===o.selected()));
    opts.forEach(el => el.onclick = () => { o.onAnswer(+el.dataset.o); mark(); });
    mark();
    $("#rt").innerHTML = o.rightHtml;
    o.wire();
  }
}

let radioMode = "choice";

  const group = lang => SCEN.filter(s=>s.lang===lang).map(s=>{ const best=S.scen[s.id];
    return `<button class="topic" data-id="${s.id}"><span>${esc(s.title)}<br><span class="sub">${s.steps.length} Schritte${best!==undefined?` · zuletzt ${best}/${s.steps.length}`:""}</span></span><span class="tag">${s.lang==="de"?"DE":"EN"}</span></button>`;}).join("");

function scenario(sc){
  setNav("radio");
  let i=0, score=0;
  const en = sc.lang==="en";
  const L = en ? {sit:"Situation",atc:"Ground station",next:"Next",show:"Show answer",ok:"Correct.",no:"Not quite. The correct transmission is marked.",model:"Model transmission",has:"included",miss:"missing",self:"How did you do?",good:"Got it",bad:"Practise",type:"Type your transmission",done:"Scenario complete",quit:"Quit",again:"Again",fin:"Done"}
                 : {sit:"Lage",atc:"Bodenstelle",next:"Weiter",show:"Lösung zeigen",ok:"Richtig.",no:"Nicht ganz. Der richtige Funkspruch ist markiert.",model:"Musterfunkspruch",has:"enthalten",miss:"fehlt",self:"Wie lief es?",good:"Sitzt",bad:"Üben",type:"Deinen Funkspruch eingeben",done:"Szenario beendet",quit:"Beenden",again:"Nochmal",fin:"Fertig"};
  const step = () => {
    if(i>=sc.steps.length){
      S.scen[sc.id]=score; save();
      main.innerHTML = `<div class="card"><span class="tag">${esc(sc.title)}</span><h2>${L.done}</h2><p class="result">${score}/${sc.steps.length}</p>
        <div class="actions"><button class="btn ghost" id="secondary">${L.fin}</button><div class="right"><button class="btn" id="primary">${L.again}</button></div></div></div>`;
      $("#secondary").onclick = () => history.back(); $("#primary").onclick = () => go(()=>scenario(sc), true);
      return;
    }
    const st = sc.steps[i], free = radioMode==="free" && st.keys && st.keys.length;
    const order = shuffle(st.opts.map((_,k)=>k));
    main.innerHTML = `<div class="card">
      <div class="cdu-title"><span class="t">${en?"Radio":"Funk"}</span><span class="p">${i+1}/${sc.steps.length}</span></div>
      <span class="tag">${esc(sc.title)}</span>
      ${prog(i, sc.steps.length)}
      ${i===0?`<p class="note">${esc(sc.intro)}</p>`:""}
      ${st.ctx?`<p><span class="label">${L.sit}</span><br>${esc(st.ctx)}</p>`:""}
      ${st.atc?`<div class="radio"><span class="who">${L.atc}</span>${esc(st.atc)}</div>`:""}
      <p class="qtext">${esc(st.task)}</p>
      ${free ? `<span class="label">Scratchpad</span><textarea id="fr" class="scratch" aria-label="${L.type}" placeholder="${L.type}"></textarea>`
             : `<div class="opts">${order.map((x,k)=>`<button class="opt" data-o="${x}"><span class="k">${"ABCD"[k]}</span><span>${esc(st.opts[x])}</span></button>`).join("")}</div>`}
      <p class="fb" id="fb" aria-live="polite"></p>
      <div id="sol" class="stack" style="gap:10px"></div>
      <div class="actions"><button class="btn ghost" id="secondary">${L.quit}</button><div class="right" id="rt">${free?`<button class="btn" id="primary">${L.show}</button>`:""}</div></div></div>`;
    $("#secondary").onclick = () => history.back();
    const finish = () => {
      if(st.note) $("#sol").insertAdjacentHTML("beforeend", `<p class="expl">${esc(st.note)}</p>`);
      $("#rt").innerHTML = `<button class="btn" id="primary">${L.next}</button>`;
      $("#primary").onclick = () => { i++; step(); window.scrollTo(0,0); }; $("#primary").focus({preventScroll:true});
    };
    if(free){
      $("#primary").onclick = () => {
        const txt = $("#fr").value.toLowerCase(); $("#fr").readOnly = true;
        $("#sol").innerHTML = `<p class="label">${L.model}</p><div class="model">${esc(st.opts[0])}</div>
          <div class="keys">${st.keys.map(k=>{ const hit=txt.includes(k.toLowerCase()); return `<span class="${hit?"hit":"miss"}">${esc(k)} · ${hit?L.has:L.miss}</span>`; }).join("")}</div>`;
        $("#sol").insertAdjacentHTML("beforeend", `<p class="label">${L.self}</p>`);
        $("#rt").innerHTML = `<button class="btn ghost" id="g0">${L.bad}</button><button class="btn" id="primary">${L.good}</button>`;
        $("#g0").onclick = finish;
        $("#primary").onclick = () => { score++; finish(); };
      };
    } else {
      const opts=[...main.querySelectorAll(".opt")];
      opts.forEach(el => el.onclick = () => {
        const ok = +el.dataset.o===0; if(ok) score++;
        opts.forEach(x => { x.disabled=true; if(+x.dataset.o===0) x.classList.add("right"); });
        if(!ok) el.classList.add("wrong");
        feedback(ok, ok?L.ok:L.no);
        finish();
      });
    }
  };
  step();
}

function examSetup(){
  setNav("exam");
  main.innerHTML = `<div class="card">
    <h2>Prüfungssimulation</h2>
    <p class="note">Zufällige Fragen aus allen Themen, Auswertung erst am Ende. Anzahl und Zeit bitte an das tatsächliche Prüfungsformat der Bundesnetzagentur anpassen.</p>
    <div class="row">
      <label class="field"><span class="label">Anzahl Fragen</span><input id="en" type="number" min="5" max="100" value="24" style="width:90px"></label>
      <label class="field"><span class="label">Minuten (0 = ohne)</span><input id="em" type="number" min="0" max="180" value="30" style="width:90px"></label>
      <label class="field"><span class="label">Bestehen ab %</span><input id="ep" type="number" min="50" max="100" value="75" style="width:90px"></label>
    </div>
    <div class="actions"><div class="right"><button class="btn" id="primary">Prüfung beginnen</button></div></div>
  </div>`;
  $("#primary").onclick = () => go(()=>exam(+$("#en").value||24, +$("#em").value||0, +$("#ep").value||75));
}
function exam(n, minutes, pass){
  setNav("exam");
  const set = shuffle(Q).slice(0, Math.min(n, Q.length));
  const ans = new Array(set.length);
  let i = 0, end = minutes ? Date.now()+minutes*60000 : 0, over = false;
  const finish = () => {
    if(over) return; over = true; clearInterval(timerId);
    let ok = 0;
    set.forEach((q,k) => { const r = ans[k]===0; if(r) ok++; record(q.n, r); });
    S.exams.push({n:set.length, ok, d:new Date().toISOString().slice(0,10)}); save();
    const pct = Math.round(100*ok/set.length), passed = pct>=pass;
    go(() => {
      setNav("exam");
      main.innerHTML = `<div class="card">
        <h2>Ergebnis</h2><p class="result" style="color:var(${passed?"--good":"--bad"})">${ok}/${set.length}</p>
        <p class="fb ${passed?"ok":"no"}">${pct} % · ${passed?"bestanden":"nicht bestanden"} (Grenze ${pass} %)</p>
        <div class="actions"><button class="btn ghost" id="secondary">Zum Start</button><div class="right"><button class="btn" id="primary">Neue Prüfung</button></div></div></div>
        <h2>Falsch beantwortet</h2>
        <div class="list">${set.map((q,k)=> ans[k]===0 ? "" : `<div class="item"><span class="qno" style="align-self:flex-start">Nr. ${q.n}</span><b>${esc(q.q)}</b>
          <span class="yours">Deine Antwort: ${ans[k]===undefined?"keine":esc(q.a[ans[k]])}</span><span class="ans">Richtig: ${esc(q.a[0])}</span>${q.e?`<p class="expl">${esc(q.e)}</p>`:""}</div>`).join("") || `<p class="note">Keine Fehler.</p>`}</div>`;
      $("#secondary").onclick = () => go(home);
      $("#primary").onclick = () => go(examSetup);
    }, true);
  };
  const tick = () => {
    if(!end) return; const left = Math.max(0, end-Date.now()), t=$("#tm");
    if(t) t.textContent = String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");
    if(left<=0) finish();
  };
  const show = () => {
    const lastQ = i===set.length-1, answered = ans.filter(x=>x!==undefined).length;
    renderQuestion(set[i], "Prüfung", i, set.length, {
      instant:false, timer:!!end,
      selected: () => ans[i],
      onAnswer: x => { ans[i]=x; const f=$("#fin"); if(f) f.textContent = `Abgeben (${ans.filter(y=>y!==undefined).length}/${set.length})`; },
      left: {label:"Zurück", act:()=>{ i--; show(); }, disabled: i===0},
      rightHtml: lastQ ? `<button class="btn" id="primary">Abgeben (${answered}/${set.length})</button>`
                       : `<button class="btn ghost" id="fin">Abgeben (${answered}/${set.length})</button><button class="btn" id="primary">Weiter</button>`,
      wire: () => {
        if(lastQ) $("#primary").onclick = finish;
        else { $("#primary").onclick = () => { i++; show(); window.scrollTo(0,0); }; $("#fin").onclick = finish; }
      }
    });
    tick();
  };
  clearInterval(timerId); if(end) timerId = setInterval(tick, 1000);
  show();
}

/* ---------- Katalog ---------- */
function catalog(preset, topic){
  setNav("catalog");
  main.innerHTML = `
    ${topic!==undefined?`<button class="back" id="bk">‹ ${esc(TOPICS[topic][0])}</button>`:""}
    <input id="cs" type="search" placeholder="Suchen, z. B. QNH, 7600, Luftraum D" aria-label="Katalog durchsuchen" value="${topic!==undefined?"":esc(preset||"")}">
    <div class="list" id="cl"></div>`;
  if($("#bk")) $("#bk").onclick = () => history.back();
  const draw = () => {
    const s = $("#cs").value.trim().toLowerCase();
    const hits = Q.filter(q => (topic===undefined || inTopic(topic,q.n)) && (!s || (q.n+" "+q.q+" "+q.a[0]).toLowerCase().includes(s)));
    $("#cl").innerHTML = hits.slice(0,80).map(q => `<div class="item"><div class="qhead"><span class="qno">Nr. ${q.n}</span>${boxes(q.n)}</div>
      <b>${esc(q.q)}</b>${SYMBOLS[q.n]?`<div class="symbol">${SYMBOLS[q.n]}</div>`:""}<span class="ans">${esc(q.a[0])}</span>
      ${q.e?`<details><summary class="label" style="cursor:pointer">Erklärung</summary><p class="expl">${esc(q.e)}</p></details>`:""}</div>`).join("")
      + (hits.length>80 ? `<p class="note">${hits.length-80} weitere Treffer, bitte Suche eingrenzen.</p>` : "")
      + (hits.length ? "" : `<p class="note">Keine Treffer.</p>`);
  };
  $("#cs").oninput = draw; draw();
}

stack.push(home); history.replaceState({d:1}, ""); home();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
